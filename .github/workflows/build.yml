name: Build ThemePark

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package Paper plugin
        run: mvn -B -ntp clean verify

      - name: Stage JAR and inspect its manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/ThemePark-1.0.0.jar dist/ThemePark-1.0.0.jar
          jar tf dist/ThemePark-1.0.0.jar | grep -qx 'plugin.yml'
          jar tf dist/ThemePark-1.0.0.jar | grep -qx 'config.yml'
          jar tf dist/ThemePark-1.0.0.jar | grep -qx 'org/pawling/themepark/ThemeParkPlugin.class'

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ThemePark-1.0.0
          path: dist/ThemePark-1.0.0.jar

      - name: Publish JAR to dist/ on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ThemePark-1.0.0.jar
          if ! git diff --cached --quiet; then
            git commit -m "Build ThemePark 1.0.0"
            git push
          fi

# Primary world for the park (matches server/server.properties level-name).
world: world

# WARNING: On the first enabled startup, replaces existing blocks in the
# spawn's 70x70 footprint. Back up the world before selecting ThemePark.
generate-on-first-enable: true

# Six-block-tall invisible BARRIER curtain around the OUTSIDE of the water ring.
# Enabled at Minecraft time 13000 and removed at 23000 and on plugin disable.
night-barrier: true

# Slowly carries swimming players clockwise around the continuous water ring.
river-current: true
river-current-speed: 0.14

# Park-owned NPC caps. No park-security golems, villagers, zombies,
# skeletons, or witches can exceed 5 of their type, even if configured higher.
# Only ThemePark-tagged entities are managed; other plugins' NPCs are untouched.
park-security-cap: 5
park-villager-cap: 5
park-zombie-cap: 5
park-skeleton-cap: 5
park-witch-cap: 5

# Additional TOTAL night monster limit (zombies + skeletons + witches).
# Default 9 gives approximately 3 of each instead of 15 at once, reducing lag.
# To allow all five of each simultaneously, set to 15 (hard per-type caps remain).
# Enemies only stay spawned while at least one visitor is actually in the park.
# Replaces the deprecated night-enemies setting.
night-total-enemies: 9

# A carousel rider is ejected after one full revolution.
carousel-degrees-per-second: 24.0

# Scripted coaster speed; every tick follows the physical rail route exactly.
coaster-blocks-per-tick: 0.46

# To press R, rebind Minecraft's Swap Item With Offhand control to R.
# Right-clicking an entrance platform or using /themepark commands also works.

name: ThemePark
main: org.pawling.themepark.ThemeParkPlugin
version: 1.0.0
api-version: '1.21'
description: 70x70 theme park with scripted single-lap rides, survival, strength and archery prizes.
author: Pawling Classroom
commands:
  themepark:
    description: Coaster, carousel, prize attractions, exit, status, and administrator rebuild.
    usage: /themepark [status|ride|carousel|strength|archery|exit|rebuild confirm]
    aliases: [park]
permissions:
  themepark.admin:
    description: Allows rebuilding the park after confirmation.
    default: op

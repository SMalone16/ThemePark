name: ThemePark
main: org.pawling.themepark.ThemeParkPlugin
version: 1.0.0
api-version: '1.21'
description: Protected 70x70 park with rides and a day/night survival challenge.
author: Pawling Classroom
commands:
  themepark:
    description: Park status, coaster, carousel, exit, and administrator rebuild.
    usage: /themepark [status|ride|carousel|exit|rebuild confirm]
    aliases: [park]
permissions:
  themepark.admin:
    description: Allows rebuilding the park after confirmation.
    default: op
